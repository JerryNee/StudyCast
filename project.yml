name: StudyCast
options:
  bundleIdPrefix: com.visionone
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StudyCast:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: StudyCast
        LSMinimumSystemVersion: "26.0"
        NSLocalNetworkUsageDescription: "StudyCast runs AirPlay receivers to record AirPlay-capable device streams on your local network."
        NSBonjourServices:
          - _airplay._tcp
          - _raop._tcp
    settings:
      base:
        HOMEBREW_PREFIX: /opt/homebrew
        PRODUCT_BUNDLE_IDENTIFIER: com.visionone.StudyCast
        PRODUCT_NAME: StudyCast
        SWIFT_OBJC_BRIDGING_HEADER: Sources/StudyCast-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(HOMEBREW_PREFIX)/include
          - $(HOMEBREW_PREFIX)/include/gstreamer-1.0
          - $(HOMEBREW_PREFIX)/include/glib-2.0
          - $(HOMEBREW_PREFIX)/lib/glib-2.0/include
          - $(HOMEBREW_PREFIX)/opt/gettext/include
          - $(SDKROOT)/usr/include/ffi
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(HOMEBREW_PREFIX)/opt/gstreamer/lib
          - $(HOMEBREW_PREFIX)/opt/glib/lib
          - $(HOMEBREW_PREFIX)/opt/gettext/lib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks/GStreamer/lib"
        OTHER_LDFLAGS:
          - $(inherited)
          - -lgstapp-1.0
          - -lgstvideo-1.0
          - -lgstaudio-1.0
          - -lgstbase-1.0
          - -lgstreamer-1.0
          - -lgobject-2.0
          - -lglib-2.0
          - -lintl
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO
    postBuildScripts:
      - name: Bundle UxPlay and GStreamer
        script: bash scripts/bundle_runtime.sh
        basedOnDependencyAnalysis: false
